<header class="bar">
  <div class="bar__inner">
    <a class="brand" href="/" aria-label="Sitescope home">
      <svg class="brand__mark" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="5" r="2.2" />
        <circle cx="5" cy="19" r="2.2" />
        <circle cx="19" cy="19" r="2.2" />
        <path d="M12 7.2v4.3M12 11.5 6.4 16.9M12 11.5l5.6 5.4" />
      </svg>
      <span class="brand__name">Sitescope</span>
    </a>

    <p class="api" [attr.data-state]="api.online()" [attr.title]="api.baseUrl" role="status">
      <span class="api__dot" aria-hidden="true"></span>{{ apiLabel() }}
    </p>
  </div>
</header>

<main>
  <router-outlet />
</main>
